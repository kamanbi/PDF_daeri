# iOS 클라우드 빌드 (Mac 없이 Codemagic macOS에서 실행). 설계: _workspace/91_architect_ios_port_design.md
# 모든 워크플로는 수동 실행 전용이다(트리거 없음) — 빌드 시간은 월 500분 무료 한도 내에서 쓴다.
workflows:
  # 서명 없이 컴파일·링크만 확인한다. Apple Developer 승인 전에도 사용 가능.
  ios-ci:
    name: iOS CI (no signing)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter 의존성 설치
        script: flutter pub get
      - name: qpdf iOS 정적 라이브러리 빌드
        script: bash tool/build_qpdf_ios.sh
      - name: iOS 컴파일 (서명 없음)
        script: flutter build ios --release --no-codesign
      - name: 최종 바이너리 qpdf 심볼 검사
        script: |
          # DynamicLibrary.process()로 찾는 심볼이 strip되지 않고 앱 실행 파일에 남아 있어야 한다.
          # (pipefail 환경에서 nm | grep -q는 조기 종료로 실패하므로 here-string으로 검사)
          BIN="build/ios/iphoneos/Runner.app/Runner"
          SYMS="$(nm -gU "$BIN" 2>/dev/null || true)"
          MISSING=""
          for s in qpdf_init qpdf_cleanup qpdf_init_write qpdf_get_num_pages qpdf_get_page_n \
                   qpdf_oh_get_type_code qpdf_oh_get_stream_data qpdf_is_encrypted; do
            grep -Eq " T _${s}\$" <<<"$SYMS" || MISSING="$MISSING $s"
          done
          if [ -n "$MISSING" ]; then echo "앱 바이너리에서 누락/제거된 qpdf 심볼:$MISSING"; exit 1; fi
          echo "OK: 앱 바이너리에 qpdf C API 심볼 보존됨"
      - name: 정적 분석
        script: flutter analyze --no-fatal-infos lib test
        # CI의 최신 Flutter가 로컬에 없는 린트 경고를 추가로 낸다 — 기록만 하고 빌드는 막지 않는다.
        ignore_failure: true
      - name: 단위 테스트
        script: flutter test
        # PDFium 렌더러 테스트(pdf_renderer_geometry_test)가 macOS 호스트에서 실패한다 — 환경 차이로
        # 로컬 Windows 전체 통과가 기준이다. 결과는 기록만 하고 빌드는 막지 않는다.
        ignore_failure: true
    artifacts:
      - build/ios/iphoneos/Runner.app
