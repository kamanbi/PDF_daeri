# iOS 클라우드 빌드 (Mac 없이 Codemagic macOS에서 실행). 설계: _workspace/91_architect_ios_port_design.md
# 모든 워크플로는 수동 실행 전용이다(트리거 없음) — 빌드 시간은 월 500분 무료 한도 내에서 쓴다.
workflows:
  # 서명 없이 컴파일·링크만 확인한다. Apple Developer 승인 전에도 사용 가능.
  ios-ci:
    name: iOS CI (no signing)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter 의존성 설치
        script: flutter pub get
      - name: qpdf iOS 정적 라이브러리 빌드
        script: bash tool/build_qpdf_ios.sh
      - name: iOS 컴파일 (서명 없음)
        script: flutter build ios --release --no-codesign
      - name: 최종 바이너리 qpdf 심볼 검사
        script: |
          # DynamicLibrary.process()로 찾는 심볼이 strip되지 않고 앱 실행 파일에 남아 있어야 한다.
          # (pipefail 환경에서 nm | grep -q는 조기 종료로 실패하므로 here-string으로 검사)
          BIN="build/ios/iphoneos/Runner.app/Runner"
          SYMS="$(nm -gU "$BIN" 2>/dev/null || true)"
          MISSING=""
          for s in qpdf_init qpdf_cleanup qpdf_init_write qpdf_get_num_pages qpdf_get_page_n \
                   qpdf_oh_get_type_code qpdf_oh_get_stream_data qpdf_is_encrypted; do
            grep -Eq " T _${s}\$" <<<"$SYMS" || MISSING="$MISSING $s"
          done
          if [ -n "$MISSING" ]; then echo "앱 바이너리에서 누락/제거된 qpdf 심볼:$MISSING"; exit 1; fi
          echo "OK: 앱 바이너리에 qpdf C API 심볼 보존됨"
      - name: 정적 분석
        script: flutter analyze --no-fatal-infos lib test
        # CI의 최신 Flutter가 로컬에 없는 린트 경고를 추가로 낸다 — 기록만 하고 빌드는 막지 않는다.
        ignore_failure: true
      - name: 단위 테스트
        script: flutter test
        # PDFium 렌더러 테스트(pdf_renderer_geometry_test)가 macOS 호스트에서 실패한다 — 환경 차이로
        # 로컬 Windows 전체 통과가 기준이다. 결과는 기록만 하고 빌드는 막지 않는다.
        ignore_failure: true
    artifacts:
      - build/ios/iphoneos/Runner.app

  # 서명한 IPA를 만들어 TestFlight에 올린다. 수동 실행 전용(규칙 9: 실행 전 사용자 확인).
  # 사전 준비(사용자): Codemagic Team integrations → App Store Connect에 API 키를 `pdf_daeri_asc`
  # 이름으로 등록. App Store Connect에 앱(번들 ID com.kamanbi.pdfdaeri)을 만들어 둘 것.
  ios-release:
    name: iOS Release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: pdf_daeri_asc
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.kamanbi.pdfdaeri
      # CERTIFICATE_PRIVATE_KEY: Codemagic 전역 변수(Global variables and secrets)에 비밀 값으로 등록한다.
      # 값은 F:\keys\PDF_daeri\ios\ios_distribution_private_key 파일 내용(저장소에 두지 않는다).
    scripts:
      - name: Flutter 의존성 설치
        script: flutter pub get
      - name: qpdf iOS 정적 라이브러리 빌드
        script: bash tool/build_qpdf_ios.sh
      - name: 키체인 초기화
        script: keychain initialize
      - name: App Store Connect에서 서명 파일 가져오기(없으면 생성)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create --certificate-key "$CERTIFICATE_PRIVATE_KEY"
      - name: 인증서를 키체인에 추가
        script: keychain add-certificates
      - name: Xcode 프로젝트에 서명 프로파일 적용
        script: xcode-project use-profiles
      - name: IPA 빌드
        # 빌드 번호는 Codemagic 카운터($BUILD_NUMBER, TestFlight는 업로드마다 증가해야 한다).
        # iOS는 광고·결제가 아직 꺼져 있어(AppFeatures) 광고 ID dart-define이 필요 없다 — 켤 때 추가한다.
        script: flutter build ipa --release --build-number=$BUILD_NUMBER --export-options-plist=/Users/builder/export_options.plist
      - name: 최종 바이너리 qpdf 심볼 검사
        script: |
          APP="$(ls -d build/ios/archive/Runner.xcarchive/Products/Applications/*.app | head -1)"
          SYMS="$(nm -gU "$APP/Runner" 2>/dev/null || true)"
          MISSING=""
          for s in qpdf_init qpdf_cleanup qpdf_init_write qpdf_get_num_pages qpdf_get_page_n \
                   qpdf_oh_get_type_code qpdf_oh_get_stream_data qpdf_is_encrypted; do
            grep -Eq " T _${s}\$" <<<"$SYMS" || MISSING="$MISSING $s"
          done
          if [ -n "$MISSING" ]; then echo "누락된 qpdf 심볼:$MISSING"; exit 1; fi
          echo "OK: qpdf 심볼 보존됨"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
